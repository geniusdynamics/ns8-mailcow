#
# Restic state/backup include patterns
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# What mailcow's own backup script saves:
# - the database, as a dump written by bin/module-dump-state (the mysql-vol
#   volume is rebuilt from it by restore-module/40restore_database)
state/mysql-mailcow.sql
# - secrets: the database and Redis passwords, the SOGo key
state/secrets.env
# - customizations of the configuration tree: extra.cf, extra.conf, rspamd
#   maps, SOGo logos (the release files are copied again from the image)
state/mailcow/conf
# - mail, and the mail_crypt keys: without them the mail cannot be read
volumes/vmail-vol-1
volumes/crypt-vol-1
# - Redis: DKIM keys, quarantine and rate limit settings, fail2ban options
#   (bin/module-dump-state saves the dump.rdb first)
volumes/redis-vol
# - rspamd statistics (Bayes, fuzzy), the Postfix queue, SOGo user backups
volumes/rspamd-vol-1
volumes/postfix-vol-1
volumes/sogo-userdata-backup-vol-1
